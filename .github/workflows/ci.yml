name: reproducibility-check

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Generate benchmark and run tests
        run: |
          make data
          make test
          make run
          make baseline
          make reproduce
          make analyze
      - name: Validate Docker build
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -t mlspec-experiment:ci .
