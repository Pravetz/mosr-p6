services:
  mlflow:
    build: .
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  experiment:
    build: .
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: python src/run_experiment.py --use-mlflow

volumes:
  mlflow-data:
