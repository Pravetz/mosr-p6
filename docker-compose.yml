services:
  mlflow:
    build: .
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////app/mlflow.db
      --default-artifact-root /app/mlruns
    ports:
      - "5000:5000"
    volumes:
      - .:/app

  experiment:
    build: .
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: python src/run_experiment.py --use-mlflow
    volumes:
      - .:/app
